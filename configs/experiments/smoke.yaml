model:
  id: allenai/OLMoE-1B-7B-0924
  revision: null
  tokenizer_id: null
  tokenizer_revision: null
  adapter: olmoe
  dtype: bfloat16
  device: cuda:0
  attention_implementation: sdpa
  quantization: none
  trust_remote_code: false

dataset:
  source: Salesforce/wikitext
  subset: wikitext-2-raw-v1
  split: validation
  revision: null
  text_field: text
  mode: concatenate
  separator: "\n\n"
  prediction_length: 64
  max_windows: 2
  streaming: false

routing:
  policy: cache_prior
  lambda: 0.5
  top_j: 2
  range_estimator: inclusive_running_mean

cache:
  policy: lru
  capacity: 32
  initial_state: empty
  reset: per_window
  update_order: descending_original_probability
  storage_bits: 16

trace:
  level: compact
  output_dir: runs

seed: 1234
run_name: smoke
