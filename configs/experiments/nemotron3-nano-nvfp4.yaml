model:
  id: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4
  revision: ce1b118ae66ec705d02c241525192832eb045fd3
  tokenizer_id: null
  tokenizer_revision: ce1b118ae66ec705d02c241525192832eb045fd3
  adapter: nemotron_h
  dtype: bfloat16
  device: cuda:0
  attention_implementation: eager
  quantization: native
  trust_remote_code: true

dataset:
  source: Salesforce/wikitext
  subset: wikitext-2-raw-v1
  split: validation
  revision: null
  text_field: text
  mode: concatenate
  separator: "\n\n"
  join_before_tokenization: true
  prediction_length: 1024
  max_windows: 32
  streaming: false

routing:
  policy: cache_prior
  lambda: 0.5
  top_j: 2
  range_estimator: inclusive_running_mean

cache:
  policy: lru
  capacity: 64
  initial_state: empty
  reset: per_window
  update_order: descending_original_probability
  storage_bits: 4

trace:
  level: compact
  output_dir: runs

seed: 1234
run_name: nemotron3-nano-nvfp4
