[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cache-prior-poc"
version = "0.1.0"
description = "A controlled proof-of-concept harness for cache-aware MoE routing"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Cache-Prior POC contributors" }]
dependencies = [
  "datasets>=3,<5",
  "numpy>=1.26",
  "PyYAML>=6",
  "torch>=2.2",
  "transformers>=5.0,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.9",
]
plot = ["matplotlib>=3.8"]
quantization = ["accelerate>=1", "bitsandbytes>=0.45"]

[project.scripts]
cacheprior = "cacheprior.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cacheprior"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

