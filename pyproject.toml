[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cache-prior-poc"
version = "0.1.0"
description = "A controlled proof-of-concept harness for cache-aware MoE routing"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Cache-Prior POC contributors" }]
dependencies = [
  "datasets>=3,<5",
  "numpy>=1.26",
  "PyYAML>=6",
  "torch>=2.2",
  "transformers>=4.48.3,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.9",
]
plot = ["matplotlib>=3.8"]
quantization = ["accelerate>=1", "bitsandbytes>=0.45"]
nemotron = [
  "accelerate>=1",
  "causal-conv1d>=1.5",
  "mamba-ssm>=2.2.5",
  "nvidia-modelopt[torch,hf]>=0.29",
  "transformers>=4.57.3,<5",
]

[project.scripts]
cacheprior = "cacheprior.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cacheprior"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv-*", "remote-test-results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
